# Render Blueprint for the crawl worker. See DEPLOYMENT.md before applying it.
# The database is a Supabase project and is deliberately not declared here, so
# applying this Blueprint can never create or replace it. Values
# marked sync: false are entered in the Render dashboard and never committed.
services:
  - type: worker
    name: web-scraper-worker
    runtime: node
    plan: starter
    # Pick the region nearest the Supabase project; the connection is over TLS
    # on the public internet. Also add PGSSLMODE=no-verify and, for the previous
    # seasons, CURRENT_SEASON_ENDING_YEAR=2026 in the dashboard (GO_LIVE_CHECKLIST.md).
    region: oregon
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm run start:worker:personal
    autoDeploy: false
    # After SIGTERM the worker lets the request on the wire finish (up to
    # requestTimeoutMs, 30 s) and commit it before it stops, so a deploy or a
    # suspend does not kill a job midway and charge its page a claim recovery.
    # Render's default is 30 s, the same as the request timeout alone.
    maxShutdownDelaySeconds: 90
    disk:
      name: raw-store
      mountPath: /var/data
      # Enough for the #78 sample; resize before the full backfill (#45).
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PERSISTENCE
        value: postgres
      # A finished or halted worker stays up and idle instead of exiting, which
      # Render would restart in a loop (DEPLOYMENT.md, "Worker").
      - key: WORKER_IDLE_ON_EXIT
        value: "true"
      - key: RAW_STORE_ROOT
        value: /var/data/raw
      # Supabase session pooler values (port 5432, user postgres.<project-ref>).
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      # Application name plus the operator's contact address.
      - key: USER_AGENT
        sync: false
      # The #78 sample, entered when the Blueprint is applied: without it the
      # first deploy would start the full 60-70 hour backfill on a 1 GB disk.
      # Managed in the dashboard after that: clear it for the full backfill.
      # For example {"schools":["/cbb/schools/duke/men/","/cbb/schools/le-moyne/men/"],"endingYears":[2024]}
      - key: CRAWL_SAMPLE
        sync: false
      # Reviewers allowed to use npm run review (dispositions, refresh-season).
      # Unset means nobody may.
      - key: OPERATOR_IDS
        sync: false
